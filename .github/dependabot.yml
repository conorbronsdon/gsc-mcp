# Maintenance mode: version-update PRs are off (limit 0). Security updates still arrive
# through Dependabot security updates, enabled in repository settings.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
